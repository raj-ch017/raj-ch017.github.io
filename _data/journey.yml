# -----------------------------------------------------------------------------
# The Journey timeline (page: /journey/)
#
# One entry per milestone. The page sorts them by `start`, so the order in this
# file does not matter. To add a milestone, copy any entry and change it.
#
#   id        short unique name, no spaces (also used for links: /journey/#neuromatch)
#   title     what it is
#   org       provider / employer / institution
#   period    text shown on the card, e.g. "Jul 2023" or "Feb 2026 – present"
#   start     sort key as "YYYY-MM" (in quotes). Decides year group and order
#   strand    maths | programming | brain | career
#   summary   one line, always visible
#   points    optional list shown when the card is opened
#   applied   optional: what you did with it
#   cert      optional: path to a certificate (PDF or image), e.g.
#             assets/certificates/my-course.pdf
# -----------------------------------------------------------------------------

